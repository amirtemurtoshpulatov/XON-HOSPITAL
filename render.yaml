services:
  - type: web
    name: xon-hospital
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && SEED_MODE=if-empty pnpm seed:clinic && pnpm build
    startCommand: pnpm start
    healthCheckPath: /ru
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: DATABASE_URL
        fromDatabase:
          name: xon-hospital-db
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PREVIEW_SECRET
        generateValue: true
      - key: PAYLOAD_DB_PUSH
        value: "true"

databases:
  - name: xon-hospital-db
    plan: free
    region: frankfurt
    databaseName: xon_hospital
    user: xon_hospital
